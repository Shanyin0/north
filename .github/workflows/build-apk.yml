name: 打包梦匣 APK

on:
  workflow_dispatch:        # 手动点按钮就能打包
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 算版本号
        # 第三位不过 9：满十就往中间那位进一。
        # 1.0.9 之后是 1.1，然后 1.1.1 … 1.1.9，再然后 1.2。
        # OFFSET 是因为 1.0.10 已经发出去过一次，把它那一格让开。
        run: |
          N=$(( ${{ github.run_number }} - 1 ))
          MINOR=$(( N / 10 ))
          PATCH=$(( N % 10 ))
          if [ "$PATCH" = "0" ]; then VER="1.$MINOR"; else VER="1.$MINOR.$PATCH"; fi
          echo "VER=$VER" >> $GITHUB_ENV
          echo "打出来的是 $VER"

      - name: 把页面塞进 APK
        # 装在壳里的这一份是「不联网也能开」的底子。
        # 开起来之后网页自己会去对版本号，有新的就换成新的。
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/page.html
          cp build.txt android/app/src/main/assets/build.txt || true
          ls -la android/app/src/main/assets

      - name: 打包
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=$VER

      - name: 改个名字
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/mengxia-$VER.apk"
          ls -la out

      - name: 存一份（Actions 里可下载）
        uses: actions/upload-artifact@v4
        with:
          name: mengxia-apk
          path: out/*.apk

      - name: 发布到 Releases（每一版都留着，写明这一版改了什么）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 这儿的账按时间记一下，省得再来回改：
          #   8/22 每一版都留 → 8/29 上午只留三个（攒了七十多个翻不完）
          #   → 8/29 晚上又改回每一版都留。这是她第二回说了，就这么定了。
          # 页面本来就是新的排最上面，不用另外排 —— 前提是别再造那种日期
          # 停住不动的固定标签（以前那个 apk 标签就是，已经删掉了）。
          STAMP=$(cat build.txt 2>/dev/null || echo "")

          # 这一版改了什么：只取提交说明里「- 」开头的那几行。
          # 她 8/29：「简短一点，改了什么就说什么，看到很烦」。
          # 所以提交正文该写多细写多细（那是给以后翻代码的人看的），
          # 但发布页上只出现那几条短的。写提交时记得列几条「- 」，
          # 一条都没有的话这儿就只剩标题。
          SUB=$(git log -1 --pretty=%s)
          git log -1 --pretty=%b | grep -E '^- ' | head -6 > notes.md
          echo "" >> notes.md
          echo "覆盖装，别卸载。内置页面 \`$STAMP\`" >> notes.md

          gh release create "v$VER" out/*.apk \
            --title "$VER · $SUB" \
            --notes-file notes.md \
            || gh release upload "v$VER" out/*.apk --clobber
