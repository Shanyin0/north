name: 打包梦匣 APK

on:
  workflow_dispatch:        # 手动点按钮就能打包
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 算版本号
        # 第三位不过 9：满十就往中间那位进一。
        # 1.0.9 之后是 1.1，然后 1.1.1 … 1.1.9，再然后 1.2。
        # OFFSET 是因为 1.0.10 已经发出去过一次，把它那一格让开。
        run: |
          N=$(( ${{ github.run_number }} - 1 ))
          MINOR=$(( N / 10 ))
          PATCH=$(( N % 10 ))
          if [ "$PATCH" = "0" ]; then VER="1.$MINOR"; else VER="1.$MINOR.$PATCH"; fi
          echo "VER=$VER" >> $GITHUB_ENV
          echo "打出来的是 $VER"

      - name: 把页面塞进 APK
        # 装在壳里的这一份是「不联网也能开」的底子。
        # 开起来之后网页自己会去对版本号，有新的就换成新的。
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/page.html
          cp build.txt android/app/src/main/assets/build.txt || true
          ls -la android/app/src/main/assets

      - name: 打包
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=$VER

      - name: 改个名字
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/mengxia-$VER.apk"
          ls -la out

      - name: 存一份（Actions 里可下载）
        uses: actions/upload-artifact@v4
        with:
          name: mengxia-apk
          path: out/*.apk

      - name: 发布到 Releases（只留最近三个，最新的在最上面）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 她 8/29 改的主意。这儿原来写着「每一版都留着，永远不删」——
          # 攒到七十多个，页面翻不完。现在只留最近三个。
          # 这是她要的，不是我省事，别再改回去。
          STAMP=$(cat build.txt 2>/dev/null || echo "")
          gh release create "v$VER" out/*.apk \
            --title "梦匣 App · $VER" \
            --notes "内置页面 $STAMP。覆盖装就行，别卸载 —— 聊天、日记、照片都在各自的地方存着，换版本不动它们。" \
            || gh release upload "v$VER" out/*.apk --clobber

          # 以前还维持一个固定的 apk 标签指向最新，删掉了：
          # 它的日期停在建它那天，在 Releases 页永远沉在最底下 ——
          # 一个标着「最新」的东西挂在最下面，只会让人下错。
          # 现在最上面那个就是最新的。
          gh release delete apk --cleanup-tag -y 2>/dev/null || true

          # 按时间倒序，第四个往后连 tag 一起删
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' > old.txt || true
          while read -r t; do
            [ -z "$t" ] && continue
            echo "删掉旧版本 $t"
            gh release delete "$t" --cleanup-tag -y || true
          done < old.txt
