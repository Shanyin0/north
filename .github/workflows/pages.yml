name: 发布梦匣网页

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon-*.png'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 打开 Pages（没开过会自动开）
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 只放网页那几个文件
        run: |
          mkdir -p site
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png site/
          ls -la site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
